name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Nightly rebuild just after midnight in Belgrade (22:10 UTC in summer, 23:10 UTC in winter):
  # tools/seo-pages.mjs then publishes the archive page with the solutions of the day that ended.
  schedule:
    - cron: '10 22 * * *'
    - cron: '10 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
